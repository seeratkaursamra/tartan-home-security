name: Tartan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: Tartan/smart-home/Platform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build (skip tests)
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: Tartan/smart-home/Platform/build/jacocoHtml/

  system-test:
    runs-on: self-hosted
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Clean up previous containers
        run: |
          cd Tartan/smart-home
          docker compose down -v || true
          docker system prune -f || true
          sleep 5
        continue-on-error: true

      - name: Run docker compose
        working-directory: Tartan/smart-home
        run: |
          docker compose up -d --build

      - name: Wait for MySQL to be healthy
        run: |
          echo "Waiting for MySQL to be healthy..."
          for i in {1..60}; do
            # Check if container exists and is running
            if docker ps --filter "name=smart-home-mysql-container-1" --filter "status=running" | grep -q mysql; then
              # Check MySQL health
              if docker exec smart-home-mysql-container-1 mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
                echo "MySQL is healthy!"
          
                # Extra verification: try to connect to the database
                if docker exec smart-home-mysql-container-1 mysql -u tartan -ptartan1234 -e "SELECT 1;" TartanHome >/dev/null 2>&1; then
                  echo "MySQL database is accessible!"
                  break
                else
                  echo "MySQL is up but database not ready yet... ($i/60)"
                fi
              else
                echo "MySQL not responding to ping... ($i/60)"
              fi
            else
              echo "MySQL container not running yet... ($i/60)"
            fi
            sleep 2
          done
          
          # Additional wait to ensure MySQL is fully ready
          echo "Waiting extra 10 seconds for MySQL to fully initialize..."
          sleep 10

      - name: Check what containers are actually running
        run: |
          echo "=== Container Status ==="
          docker compose -f Tartan/smart-home/docker-compose.yml ps
          echo ""
          echo "=== MySQL Logs (last 30 lines) ==="
          docker compose -f Tartan/smart-home/docker-compose.yml logs --tail=30 mysql-container
          echo ""
          echo "=== Platform Logs (last 30 lines) ==="
          docker compose -f Tartan/smart-home/docker-compose.yml logs --tail=30 platform

      - name: Wait for platform (treat 200/401 as ready)
        run: |
          echo "Waiting for platform to be ready..."
          for i in {1..90}; do       
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/smarthome/state/mse || true)
            echo "Attempt $i/180: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "Platform is up (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "Platform did not become ready after 180 seconds"
          echo ""
          echo "=== Final Container Status ==="
          docker compose -f Tartan/smart-home/docker-compose.yml ps
          echo ""
          echo "=== Full Platform Logs ==="
          docker compose -f Tartan/smart-home/docker-compose.yml logs platform
          echo ""
          echo "=== Full MySQL Logs ==="
          docker compose -f Tartan/smart-home/docker-compose.yml logs mysql-container
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run system tests
        working-directory: Tartan/smart-home/Platform/system_tests
        run: |
          pytest -v

      - name: Bring server down
        if: always()
        working-directory: Tartan/smart-home
        run: |
          docker compose down -v

  deploy:
    needs: system-test
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Remove .git to prevent access issue
        run: |
          echo "Exclude .git..."
          rm -rf .git
        shell: bash

      - name: Copy project to Cybera
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          source: "Tartan/smart-home"
          target: "~/prod"
          overwrite: true

      - name: Deploy on Cybera
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd ~/prod/Tartan/smart-home
            
            ./save-backup.sh || echo "No previous deployment to backup"
            
            docker compose down || true
            docker compose up --build -d
            
            # Wait for MySQL health
            echo "Waiting for MySQL..."
            for i in {1..60}; do
              if docker exec smart-home-mysql-container-1 mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
                echo "MySQL is ready!"
                break
              fi
              sleep 2
            done
            
            # Wait for platform
            echo "Waiting for platform..."
            for i in {1..60}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/smarthome/state/mse || true)
              if [ "$code" = "200" ] || [ "$code" = "401" ]; then
                echo "Platform is ready!"
                break
              fi
              sleep 2
            done
            
            echo "Deployment complete!"