name: Tartan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Tartan/smart-home/Platform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build (skip tests)
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: Tartan/smart-home/Platform/build/jacocoHtml/

  system-test:
    runs-on: self-hosted
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Clean up previous containers #hopefully fixes the issue of the test failing
        run: |
          cd Tartan/smart-home
          docker compose down -v || true
          docker system prune -f || true
        continue-on-error: true

      - name: Run docker compose
        working-directory: Tartan/smart-home
        run: |
          docker compose up -d --build


      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if docker exec smart-home-mysql-container-1 mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL is ready!"
              break
            fi
            echo "MySQL not ready yet... ($i/30)"
            sleep 2
          done
          sleep 5

      - name: Wait for platform (treat 200/401 as ready)
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/smarthome/state/mse || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "Platform is up (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "Platform did not become ready"
          docker compose -f Tartan/smart-home/docker-compose.yml ps
          docker compose -f Tartan/smart-home/docker-compose.yml logs --no-color
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run system tests
        working-directory: Tartan/smart-home/Platform/system_tests
        run: |
          pytest -q

      - name: Bring server down
        if: always()
        working-directory: Tartan/smart-home
        run: |
          docker compose down -v

  deploy:
    needs: system-test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Remove .git to prevent access issue
        run: |
          echo "Exclude .git..."
          rm -rf .git
        shell: bash

      - name: Copy project to Cybera
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          source: "Tartan/smart-home"
          target: "~/prod"
          overwrite: true

      - name: Deploy on Cybera
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd ~/prod/Tartan/smart-home
            docker compose down || true
            docker compose up --build -d