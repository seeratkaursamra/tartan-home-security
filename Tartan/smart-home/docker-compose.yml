version: '3'
services:
  house-cmu: 
    build: HouseSimulator/
    ports:
     - "5051:5050"
  house-mse: 
    build: HouseSimulator/
    ports:
     - "5050:5050"
  platform:
    build:
      context: Platform/
      no_cache: true
    depends_on:
      mysql-container:
        condition: service_healthy
      house-cmu:
        condition: service_started
      house-mse:
        condition: service_started
    ports:
     - "8080:8080"
  mysql-container:
    build: Database/
    ports:
     - "3306:3306"
    volumes:
     - mysql-storage:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql-storage: