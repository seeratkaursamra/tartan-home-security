# the houses currently supported/connected to the service
houses:
    # Each house has a name
  - name: mse
    # a network address/port combination
    address: house-mse
    port: 5050

    # a set of default user
    user: admin
    password: 1234

    # the default configuration for the house

    # we must know the target temperature to start
    targetTemp: 70

    # the default alarm delay
    alarmDelay: 30

    # and the super secret passcode to disable the alarm
    alarmPasscode: stop

    # passcode for smart door lock (Electronic Operation)
    lockPasscode: "1234"

    # AB test: report variant (usage_only = minutes only, cost_estimate = cost in CAD)
    reportVariant: usage_only

    # Next house
  - name: cmu
    address: house-cmu
    port: 5050

    user: admin
    password: 5678
    targetTemp: 70
    alarmDelay: 30
    alarmPasscode: quit
    lockPasscode: "5678"
    reportVariant: cost_estimate

  - name: eng
    address: house-eng
    port: 5050

    user: eng
    password: 1234
    targetTemp: 70
    alarmDelay: 30
    alarmPasscode: stop
    lockPasscode: "1234"
    reportVariant: usage_only

  - name: sci
    address: house-sci
    port: 5050

    user: sci
    password: 5678
    targetTemp: 70
    alarmDelay: 30
    alarmPasscode: quit
    lockPasscode: "5678"
    reportVariant: cost_estimate

# how many seconds between database snapshots
historyTimer: 5

# configuration information for the database. This setup uses MySQL with a database named 'TartanHome'
# but any DBMS that supports JDBC can be used
database:
    # the name of the JDBC driver to use
    driverClass: com.mysql.cj.jdbc.Driver

    # the DB username
    user: tartan

    # the DB password
    password: tartan1234

    # the JDBC URL; the database is called TartanHome; #mysql-container
    url: jdbc:mysql://mysql-container/TartanHome?useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC

    # Allow Hibernate to create tables
    properties:
        hibernate.dialect: org.hibernate.dialect.MySQLDialect

        # leave it to hibernate to update/create the database. Warning, this is generally
        # considered a bad setting for production
        hibernate.hbm2ddl.auto: update
