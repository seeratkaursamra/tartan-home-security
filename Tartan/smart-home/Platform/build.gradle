plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.15.0'
    id 'com.github.spotbugs' version '6.0.9'       // SpotBugs
    id 'pmd'                                         // PMD (built into Gradle)
    id 'net.ltgt.errorprone' version '4.0.1'         // Error Prone
}
group 'Tartan'
version '1.0-SNAPSHOT'
apply plugin: 'java'
apply plugin: 'application'
application {
    mainClass = 'tartan.smarthome.TartanHomeApplication'
}
sourceCompatibility = 21
targetCompatibility = 21
repositories {
    mavenLocal()
    mavenCentral()
}
dependencies {
    implementation "javax.xml.bind:jaxb-api:2.3.1"
    implementation "com.sun.xml.bind:jaxb-core:4.0.4"
    implementation "com.sun.xml.bind:jaxb-impl:4.0.4"
    implementation "javax.activation:activation:1.1.1"
    implementation 'io.dropwizard:dropwizard-bom:4.0.7'
    implementation 'io.dropwizard:dropwizard-core:4.0.7'
    implementation 'io.dropwizard:dropwizard-views-freemarker:4.0.7'
    implementation 'io.dropwizard:dropwizard-auth:4.0.7'
    implementation 'io.dropwizard:dropwizard-hibernate:4.0.7'
    implementation 'io.dropwizard:dropwizard-assets:4.0.7'
    implementation 'mysql:mysql-connector-java:8.0.33'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    errorprone 'com.google.errorprone:error_prone_core:2.28.0'
}
run {
    args = ['server', 'config.yml']
}
shadowJar {
    mergeServiceFiles()
    manifest {
        attributes(
                'Implementation-Title': rootProject.name,
                'Implementation-Version': rootProject.version,
                'Implementation-Vendor-Id': rootProject.group,
                'Created-By': 'Gradle ' + gradle.gradleVersion,
                'Main-Class': 'tartan.smarthome.TartanHomeApplication'
        )
    }
    archiveFileName.set(rootProject.name + '-' + rootProject.version + '.jar')
}
tasks.named('distZip').configure {
    dependsOn tasks.named('shadowJar')
}
tasks.named('distTar').configure {
    dependsOn tasks.named('shadowJar')
}
tasks.named('startScripts').configure {
    dependsOn tasks.named('shadowJar')
}
tasks.named('startShadowScripts').configure {
    dependsOn tasks.named('shadowJar')
}
tasks.named('jar').configure {
    enabled = false
}
test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}
jacoco {
    toolVersion = "0.8.12"
}
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, includes: [
                'tartan/smarthome/resources/StaticTartanStateEvaluator.class', //part 1 mainly, but also used for part 2
                'tartan/smarthome/resources/iotcontroller/UserLoginInfo.class',

                //'tartan/smarthome/resources/iotcontroller/IoTControlManager.class', //part 2 mainly (Stse above)
                'tartan/smarthome/resources/KeylessEntry.class',
                'tartan/smarthome/resources/ElectronicOperation.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                'tartan.smarthome.resources.StaticTartanStateEvaluator'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}
pitest {
    targetClasses = [
            'tartan.smarthome.resources.StaticTartanStateEvaluator',
            //'tartan.smarthome.resources.iotcontroller.UserLoginInfo', // part 1 not applicable here
            'tartan.smarthome.resources.KeylessEntry',
            'tartan.smarthome.resources.ElectronicOperation'
    ]
    targetTests = ['tartan.smarthome.*']
    junit5PluginVersion = '1.2.1'
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}

spotbugsMain {
    ignoreFailures = true
    reports {
        html.required = true
        xml.required = true
    }
}
spotbugsTest {
    ignoreFailures = true
    reports {
        html.required = true
        xml.required = true
    }
}

pmd {
    toolVersion = '7.0.0'
    consoleOutput = true
    ignoreFailures = true
    ruleSets = [
        'category/java/bestpractices.xml',
        'category/java/codestyle.xml',
        'category/java/design.xml',
        'category/java/errorprone.xml',
        'category/java/multithreading.xml',
        'category/java/performance.xml',
        'category/java/security.xml'
    ]
}
tasks.withType(JavaCompile).configureEach {
    options.errorprone.enabled = true
    options.errorprone.warn('EqualsHashCode')
    options.errorprone.warn('DoubleBraceInitialization')
}